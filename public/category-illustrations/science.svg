<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 3D Isometric Science Laboratory Scene -->
  <defs>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="none"/>
  
  <!-- Laboratory Table (Isometric) -->
  <polygon points="40,140 160,140 180,120 60,120" fill="url(#tableGrad)" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="40,140 40,160 60,140 60,120" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="160,140 160,160 180,140 180,120" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Test Tube Rack -->
  <rect x="70" y="100" width="60" height="8" fill="#8b5cf6" rx="4"/>
  <circle cx="85" cy="104" r="3" fill="#374151"/>
  <circle cx="100" cy="104" r="3" fill="#374151"/>
  <circle cx="115" cy="104" r="3" fill="#374151"/>
  
  <!-- Test Tubes -->
  <rect x="82" y="85" width="6" height="25" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <rect x="97" y="80" width="6" height="30" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <rect x="112" y="88" width="6" height="22" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  
  <!-- Liquids in test tubes -->
  <rect x="83" y="95" width="4" height="15" fill="#ef4444" rx="2"/>
  <rect x="98" y="95" width="4" height="15" fill="#22c55e" rx="2"/>
  <rect x="113" y="98" width="4" height="12" fill="#3b82f6" rx="2"/>
  
  <!-- Beaker -->
  <ellipse cx="50" cy="125" rx="12" ry="8" fill="url(#beakerGrad)"/>
  <path d="M 38,125 Q 38,105 50,105 Q 62,105 62,125" fill="none" stroke="#1e40af" stroke-width="2"/>
  <ellipse cx="50" cy="105" rx="12" ry="3" fill="#60a5fa"/>
  
  <!-- Flask -->
  <ellipse cx="150" cy="130" rx="10" ry="6" fill="url(#flaskGrad)"/>
  <path d="M 145,130 L 148,110 L 152,110 L 155,130" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <rect x="149" y="100" width="2" height="15" fill="#6b7280"/>
  <ellipse cx="150" cy="100" rx="3" ry="1" fill="#9ca3af"/>
  
  <!-- Microscope -->
  <ellipse cx="120" cy="135" rx="8" ry="5" fill="#374151"/>
  <rect x="118" y="120" width="4" height="15" fill="#4b5563"/>
  <ellipse cx="120" cy="120" rx="6" ry="3" fill="#6b7280"/>
  <rect x="117" y="115" width="6" height="8" fill="#374151" rx="3"/>
  
  <!-- Floating Molecules -->
  <g transform="translate(30,50)">
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
    <circle cx="8" cy="5" r="3" fill="#3b82f6"/>
    <circle cx="15" cy="2" r="3" fill="#ef4444"/>
    <line x1="4" y1="0" x2="8" y2="5" stroke="#6b7280" stroke-width="1"/>
    <line x1="8" y1="5" x2="15" y2="2" stroke="#6b7280" stroke-width="1"/>
  </g>
  
  <g transform="translate(160,60)">
    <circle cx="0" cy="0" r="3" fill="#10b981"/>
    <circle cx="6" cy="4" r="4" fill="#8b5cf6"/>
    <circle cx="12" cy="1" r="3" fill="#f59e0b"/>
    <line x1="3" y1="0" x2="6" y2="4" stroke="#6b7280" stroke-width="1"/>
    <line x1="6" y1="4" x2="12" y2="1" stroke="#6b7280" stroke-width="1"/>
  </g>
  
  <!-- Bubbles/Atoms -->
  <circle cx="170" cy="80" r="2" fill="#60a5fa" opacity="0.7"/>
  <circle cx="25" cy="70" r="1.5" fill="#34d399" opacity="0.7"/>
  <circle cx="180" cy="50" r="1" fill="#fbbf24" opacity="0.7"/>
</svg>